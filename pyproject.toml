[project]
name = "certcoach"
version = "0.1.0"
description = "Multi-tenant RAG coaching assistant for cloud certifications"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "markdownify>=0.12",
    "pdfminer.six>=20221105",
    "tiktoken>=0.7",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
demo = ["streamlit>=1.35", "requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
