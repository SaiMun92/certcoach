# CertCoach — ingestion source manifest
# ---------------------------------------------------------------------------
# This file is the CHECKED-IN record of corpus provenance. The raw documents it
# points at are fetched at ingestion time into the gitignored data/ directory and
# are NOT committed (they are copyrighted vendor docs; we do not redistribute them).
#
# HARD RULE — first-party, freely-published vendor documentation ONLY.
#   NO exam "dumps" / brain-dumps / ExamTopics / Whizlabs / Tutorials Dojo or any
#   third-party crammer content. Those are copyrighted commercial products and/or
#   violate the certification NDA, and would make the project indefensible in a
#   technical deep-dive. See spec.md §8 "Data sourcing & licensing".
#
# The ingestion script reads this manifest, fetches each `url`, and stamps the
# per-chunk metadata the retrieval design needs: tenant, source (citation),
# source_version, source_date (see spec.md §4, architecture.md §2).
#
# NOTE: the four URLs that were previously unverified were each confirmed
# against the live first-party vendor site (HTTP 200 + correct document) on the
# date noted inline. The remaining URLs are canonical, stable vendor paths; the
# authoritative liveness record for ALL documents is the provenance index the
# fetch run writes to data/fetch_index.json (per-doc http_status + ok flag).
# The `# TODO: add` lines are optional future expansions, not unverified URLs.
# `fetched_date`/`source_date` are populated by the ingestion script at fetch
# time, not by hand.
# ---------------------------------------------------------------------------

version: 1

# Applied to every document unless overridden per-entry.
defaults:
  fetched_date: null          # ISO-8601, stamped by the ingestion script at fetch time
  corpus: true                # true = embed into retrieval store; false = eval-only source

# type enum:   exam_guide | faq | whitepaper | doc | sample_questions
# format enum: pdf | html

tenants:

  aws-saa:
    display_name: "AWS Certified Solutions Architect – Associate (SAA-C03)"
    license: >
      (c) Amazon Web Services. Official AWS documentation, freely accessible. Used here
      for non-commercial portfolio/demo purposes only; not redistributed or committed.
    documents:

      # --- Skeleton: defines exam domains/objectives (drives gold-set tagging) ---
      - id: saa-exam-guide
        title: "AWS Certified Solutions Architect – Associate (SAA-C03) Exam Guide"
        url: "https://d1.awsstatic.com/training-and-certification/docs-sa-assoc/AWS-Certified-Solutions-Architect-Associate_Exam-Guide.pdf"  # verified 2026-07-24: 200, SAA-C03 exam guide PDF
        type: exam_guide
        format: pdf
        source_version: "SAA-C03"
        citation: "AWS SAA-C03 Exam Guide"

      # --- Meat: service FAQs (highest exam signal per token) ---
      - id: faq-ec2
        title: "Amazon EC2 FAQs"
        url: "https://aws.amazon.com/ec2/faqs/"
        type: faq
        format: html
        citation: "Amazon EC2 FAQs"
      - id: faq-s3
        title: "Amazon S3 FAQs"
        url: "https://aws.amazon.com/s3/faqs/"
        type: faq
        format: html
        citation: "Amazon S3 FAQs"
      - id: faq-vpc
        title: "Amazon VPC FAQs"
        url: "https://aws.amazon.com/vpc/faqs/"
        type: faq
        format: html
        citation: "Amazon VPC FAQs"
      # TODO: add faq-iam, faq-rds, faq-dynamodb, faq-route53, faq-elb, faq-ebs,
      #       faq-cloudfront, faq-sqs, faq-sns, faq-lambda, faq-aurora

      # --- Structured depth: Well-Architected Framework (table-rich) ---
      - id: well-architected-framework
        title: "AWS Well-Architected Framework"
        url: "https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"
        type: whitepaper
        format: html
        citation: "AWS Well-Architected Framework"

      # --- Eval only: official sample questions (NOT embedded into the corpus) ---
      - id: saa-sample-questions
        title: "AWS Certified Solutions Architect – Associate — Official Sample Questions"
        url: "https://d1.awsstatic.com/training-and-certification/docs-sa-assoc/AWS-Certified-Solutions-Architect-Associate_Sample-Questions.pdf"  # verified 2026-07-24: 200, official SAA sample-questions PDF
        type: sample_questions
        format: pdf
        corpus: false
        citation: "AWS SAA-C03 Official Sample Questions"

